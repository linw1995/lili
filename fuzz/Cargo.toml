[package]
name = "lili-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lili-actions = { path = "../lili-actions" }
lili-pet = { path = "../lili-pet" }
lili-session = { path = "../lili-session" }
serde_json = "1"

[[bin]]
name = "pet_manifest"
path = "fuzz_targets/pet_manifest.rs"
