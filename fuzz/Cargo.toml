test = false
doc = false
bench = false

[[bin]]
name = "forwarding_frame"
path = "fuzz_targets/forwarding_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "spool_record"
path = "fuzz_targets/spool_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "action_config"
path = "fuzz_targets/action_config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "interaction_context"
path = "fuzz_targets/interaction_context.rs"
