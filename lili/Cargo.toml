[package]
name = "lili"
default-run = "lili"
version.workspace = true
edition.workspace = true
license.workspace = true
autobins = false

[features]
acceptance = ["release-tools"]
release-tools = []

[[bin]]
name = "lili"
path = "src/main.rs"

[[bin]]
name = "lili-hook"
path = "src/bin/lili-hook.rs"
required-features = ["release-tools"]

[[bin]]
name = "lili-codex-matrix"
path = "src/bin/lili-codex-matrix.rs"
required-features = ["release-tools"]

[[bin]]
name = "lili-action-tree-fixture"
path = "src/bin/lili-action-tree-fixture.rs"
required-features = ["acceptance"]

[[bin]]
name = "lili-linux-acceptance"
path = "src/bin/lili-linux-acceptance.rs"
required-features = ["acceptance"]

[[bin]]
name = "lili-macos-acceptance"
path = "src/bin/lili-macos-acceptance.rs"
required-features = ["acceptance"]

[[bin]]
name = "lili-windows-acceptance"
path = "src/bin/lili-windows-acceptance.rs"
required-features = ["acceptance"]

[[test]]
name = "plugin_hook"
path = "tests/plugin_hook.rs"
required-features = ["release-tools"]

[lib]
name = "lili_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json.workspace = true
tauri-build.workspace = true

[dependencies]
axum.workspace = true
axum-server = { version = "0.8", features = ["tls-rustls"] }
getrandom.workspace = true
hmac.workspace = true
lili-actions = { path = "../lili-actions" }
lili-app-state = { path = "../lili-app-state" }
lili-core = { path = "../lili-core" }
lili-integration = { path = "../lili-integration" }
lili-pet = { path = "../lili-pet" }
lili-server = { path = "../lili-server" }
lili-session = { path = "../lili-session" }
rcgen = "0.14"
rustix.workspace = true
rustls = "0.23"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri = { workspace = true, features = ["macos-private-api", "tray-icon"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "NSEvent",
  "NSPanel",
  "NSResponder",
  "NSUserInterfaceItemIdentification",
  "NSUserInterfaceValidation",
  "NSWindow",
  "block2",
] }
objc2-foundation = { version = "0.3", features = [
  "NSObject",
  "NSString",
  "NSURLAuthenticationChallenge",
  "NSURLCredential",
  "NSURLProtectionSpace",
  "NSURLSession",
] }
objc2-security = { version = "0.3", features = [
  "SecBase",
  "SecCertificate",
  "SecTrust",
] }
objc2-web-kit = { version = "0.3", features = [
  "WKDownload",
  "WKNavigation",
  "WKNavigationAction",
  "WKNavigationDelegate",
  "WKNavigationResponse",
  "WKWebView",
  "block2",
  "objc2-app-kit",
] }

[target.'cfg(target_os = "windows")'.dependencies]
base64 = "0.22"
webview2-com = "0.38.2"
windows = { version = "0.61", features = ["Win32_System_Com"] }
windows-sys.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18"
webkit2gtk = "2.0.2"

[dev-dependencies]
serde_json.workspace = true
tower.workspace = true
