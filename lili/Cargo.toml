[package]
name = "lili"
default-run = "lili"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "lili_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json.workspace = true
tauri-build.workspace = true

[dependencies]
axum.workspace = true
axum-server = { version = "0.8", features = ["tls-rustls"] }
getrandom.workspace = true
hmac.workspace = true
lili-app-state = { path = "../lili-app-state" }
lili-pet = { path = "../lili-pet" }
lili-server = { path = "../lili-server" }
lili-session = { path = "../lili-session" }
rcgen = "0.14"
rustls = "0.23"
serde.workspace = true
sha2.workspace = true
tauri = { workspace = true, features = ["macos-private-api", "tray-icon"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
  "NSObject",
  "NSString",
  "NSURLAuthenticationChallenge",
  "NSURLCredential",
  "NSURLProtectionSpace",
  "NSURLSession",
] }
objc2-security = { version = "0.3", features = [
  "SecBase",
  "SecCertificate",
  "SecTrust",
] }
objc2-web-kit = { version = "0.3", features = [
  "WKDownload",
  "WKNavigation",
  "WKNavigationAction",
  "WKNavigationDelegate",
  "WKNavigationResponse",
  "WKWebView",
  "block2",
  "objc2-app-kit",
] }

[dev-dependencies]
serde_json.workspace = true
tower.workspace = true
