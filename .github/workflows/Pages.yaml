name: Website

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/Pages.yaml
      - .github/actions/setup-nix/**
      - site/**
      - web/lili.css
      - lili-ui/**
      - lili-core/**
      - lili-pet/**
      - plugins/lili/assets/logo.png
      - scripts/*site.mjs
      - Trunk.site.toml
      - Cargo.toml
      - Cargo.lock
      - package*.json
      - flake.*
      - nix/**
  push:
    branches: [main]
    paths:
      - .github/workflows/Pages.yaml
      - .github/actions/setup-nix/**
      - site/**
      - web/lili.css
      - lili-ui/**
      - lili-core/**
      - lili-pet/**
      - plugins/lili/assets/logo.png
      - scripts/*site.mjs
      - Trunk.site.toml
      - Cargo.toml
      - Cargo.lock
      - package*.json
      - flake.*
      - nix/**

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          cache-key-name: website
      - name: Build release website
        run: nix develop --command npm run build:site -- --release
      - name: Check repository Pages path in Chromium and WebKit
        env:
          LILI_SITE_BASE_PATH: /lili/
        run: |
          nix develop --command bash -euo pipefail -c '
            npm ci
            npx playwright install --with-deps chromium webkit
            node scripts/check-site.mjs
          '
      - name: Export README animation
        env:
          LILI_SITE_BASE_PATH: /lili/
        run: nix develop .#website --command npm run capture:site -- --no-build
      - name: Upload review artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: website-preview
          path: dist/site
          if-no-files-found: error
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
