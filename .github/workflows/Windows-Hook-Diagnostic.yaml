name: Windows hook diagnostic

on:
  push:
    branches:
      - fix/windows-hook-launcher

permissions:
  contents: read

jobs:
  launcher:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Inspect Windows PowerShell runtime
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          [Runtime.InteropServices.RuntimeInformation]::OSArchitecture
      - name: Install reviewed CLI
        shell: pwsh
        run: |
          npm install --prefix target/launcher-cli --no-save @openai/codex@0.147.0
          $binary = Get-ChildItem -Path target/launcher-cli/node_modules/@openai -Filter codex.exe -Recurse | Select-Object -First 1
          "CODEX_BIN=$($binary.FullName)" >> $env:GITHUB_ENV
      - name: Exercise the declared Windows hook command
        shell: pwsh
        run: python tests/plugin/test_windows_launcher.py
