name: Publish release

on:
  workflow_call:
    inputs:
      artifact-prefix:
        required: true
        type: string
      publish:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Read and validate release version
        id: version
        env:
          PUBLISH_RELEASE: ${{ inputs.publish }}
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace\.package\]$/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            test "$REF_TYPE" = "tag"
            test "$RELEASE_TAG" = "v$version"
          fi

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: arm64-apple-darwin
            toolchain: nix
          - runner: ubuntu-latest
            platform: x86_64-unknown-linux-gnu
            toolchain: nix
          - runner: windows-latest
            platform: x86_64-pc-windows-msvc
            toolchain: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - if: matrix.toolchain == 'nix'
        uses: ./.github/actions/setup-nix
        with:
          cache-key-name: release-${{ matrix.platform }}
      - if: matrix.toolchain == 'windows'
        uses: ./.github/actions/setup-windows
      - name: Build Unix release archive
        if: matrix.toolchain == 'nix'
        run: nix run .#build
      - name: Build Windows release archive
        if: matrix.toolchain == 'windows'
        shell: pwsh
        run: ./scripts/build-release.ps1
      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.platform }}
          path: |
            release/*.tar.gz
            release/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Upload plugin forwarder
        uses: actions/upload-artifact@v7
        with:
          name: lili-plugin-input-${{ github.run_id }}-${{ matrix.platform }}
          path: release/forwarders
          if-no-files-found: error
          retention-days: 1

  assemble-plugin:
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-nix
        with:
          cache-key-name: plugin-archive
      - name: Download native plugin forwarders
        uses: actions/download-artifact@v8
        with:
          pattern: lili-plugin-input-${{ github.run_id }}-*
          path: target/plugin-forwarders
          merge-multiple: true
      - name: Assemble deterministic universal plugin
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          nix run .#plugin-archive -- \
            --forwarders target/plugin-forwarders \
            --output "release/lili-plugin-$VERSION.zip"
      - name: Upload universal plugin archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-plugin
          path: |
            release/lili-plugin-${{ needs.validate.outputs.version }}.zip
            release/lili-plugin-${{ needs.validate.outputs.version }}.zip.sha256
            release/lili-plugin-${{ needs.validate.outputs.version }}.manifest.json
          if-no-files-found: error
          retention-days: 1

  publish:
    if: inputs.publish
    needs:
      - validate
      - build
      - assemble-plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact-prefix }}-*
          path: artifacts
          merge-multiple: true
      - name: Validate complete release set
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          cd artifacts
          expected=(
            "lili-$VERSION-arm64-apple-darwin.tar.gz"
            "lili-$VERSION-x86_64-unknown-linux-gnu.tar.gz"
            "lili-$VERSION-x86_64-pc-windows-msvc.tar.gz"
          )
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 9
          for archive in "${expected[@]}"; do
            test -f "$archive"
            test -f "$archive.sha256"
            sha256sum -c "$archive.sha256"
          done
          plugin="lili-plugin-$VERSION.zip"
          test -f "$plugin"
          test -f "$plugin.sha256"
          test -f "lili-plugin-$VERSION.manifest.json"
          sha256sum -c "$plugin.sha256"
          unzip -t "$plugin"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$RELEASE_TAG" artifacts/* --verify-tag --generate-notes --title "$RELEASE_TAG"
