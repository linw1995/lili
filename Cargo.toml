[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace]
resolver = "2"
members = [
  "lili",
  "lili-actions",
  "lili-app-state",
  "lili-core",
  "lili-integration",
  "lili-pet",
  "lili-server",
  "lili-session",
  "lili-ui",
  "lili-web",
]

[workspace.dependencies]
axum = "0.8"
getrandom = "0.4"
hmac = "0.13"
http = "1"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
js-sys = "0.3"
leptos = { version = "0.8.20", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = "2.11.5"
tauri-build = "2.6.3"
thiserror = "2"
toml_edit = "0.25.13"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["js", "serde", "v4"] }
wasm-bindgen = "=0.2.126"
web-sys = "0.3"

[workspace.dependencies.rustix]
version = "1"
features = ["process"]

[workspace.dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
]

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
